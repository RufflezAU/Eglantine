# matrix-profile: p06-docked-1x-sync-high
# tensor: unset
# reject-hash: default
# expect: upstream analog; start here
#
# Overlay only: run-profile.sh merges these keys into a copy of a full base ini.
# Every key carries \default=false; with \default=true the emulator ignores the value.

[Renderer]
resolution_setup\default=false
resolution_setup=3
scaling_filter\default=false
scaling_filter=5
astc_recompression\default=false
astc_recompression=2
accelerate_astc\default=false
accelerate_astc=1
use_asynchronous_shaders\default=false
use_asynchronous_shaders=false
gpu_accuracy\default=false
gpu_accuracy=1
use_vsync\default=false
use_vsync=2

[System]
use_docked_mode\default=false
use_docked_mode=1
